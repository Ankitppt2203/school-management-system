#################################################
# APPLICATION
#################################################
spring.application.name=school-management

#################################################
# SERVER
#################################################
server.port=8081

#################################################
# DATABASE (PostgreSQL - LOCAL)
#################################################
spring.datasource.url=jdbc:postgresql://localhost:5432/school_db
spring.datasource.username=postgres
spring.datasource.password=Ramanujan@1729
spring.datasource.driver-class-name=org.postgresql.Driver

#################################################
# JPA / HIBERNATE
#################################################
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#################################################
# JWT
#################################################
jwt.secret=MyVeryLongSecretKeyForSchoolManagementProject123456789

#################################################
# DEFAULT SEED USERS
#################################################
app.seed.admin-password=admin123
app.seed.teacher-password=teacher123
app.seed.student-password=teacher123
app.seed.parent-password=parent123

#################################################
# LOGGING
#################################################
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

#################################################
# JACKSON
#################################################
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=Asia/Kolkata